---
name: "beta-release"
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    if: github.actor == 'jellydn'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build
        run: make clean build release
      - uses: actions/upload-artifact@v7
        with:
          name: NDS.pak.zip
          path: dist/NDS.pak.zip
          retention-days: 1
      - name: Post Beta link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "## Beta
          Build OK. Download from Actions artifacts. Expires 30m."
